<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOKIRLALMIAH</title>
</head>
<body class="body">




    
    <div class="message-sent-box">
        <h1>Message sent successfully.</h1>
        <p>We will contact with you soon.</p>
        <a href="http://fokirlalmiah.com/"><button>Back Home</button></a>
    </div>






    <style>
            body{
        background-image: url(../images//fokirlal-background-img-black_clipdrop-relight.jpg);
        background-attachment: fixed;
        background-position: cover;
        background-repeat: no-repeat;
        background-size: 100%;
        margin: 0;
        padding: 0;
        font-family: sans-serif;

    }

    *{
        box-sizing: border-box;
    }


    
    .message-sent-box h1{
        color: white;
    }
    .message-sent-box p{
        color: rgba(245, 245, 245, 0.788);
    }

    .message-sent-box a{
        text-decoration: none;
    }

    .message-sent-box button{
        cursor: pointer;
        padding: 15px 30px;
        border-radius: 20px;
        font-size: 16px;
        font-weight: 500;
        border: none;
    }




    
/* PC - PC - PC - PC - PC - PC - PC - PC - PC - PC - PC - PC - PC - PC - PC - PC - PC - PC - PC - PC - PC - PC - PC - PC - PC - PC - PC - PC - PC - PC - PC */
@media screen and (min-width: 1200px) {
.body{
    background-color: black;
}
.message-sent-box{
        text-align: center;
        margin-top: 20%;
    }

}

/* PHONE - PHONE - PHONE - PHONE - PHONE - PHONE - PHONE - PHONE - PHONE - PHONE - PHONE - PHONE - PHONE - PHONE - PHONE - PHONE - PHONE - PHONE - PHONE */
@media screen and (max-width: 1200px) {

.body{
    background-color: black;
}
.message-sent-box{
        text-align: center;
        margin-top: 40%;
    }

}



    </style>

    
</body>
</html>
